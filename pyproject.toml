[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netkit"
version = "0.1.0"
description = "IPv4 addressing and routing toolkit: subnetting, VLSM, route summarisation, longest-prefix matching and link-state routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guelord Mwenderwa" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netkit = "netkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
